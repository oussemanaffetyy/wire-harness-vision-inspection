app:
  name: wire-harness-vision-inspection
  version: 0.1.0

runtime:
  show_window: true
  loop_video: false
  save_nok_snapshots: true
  snapshot_dir: data/snapshots
  snapshot_cooldown_frames: 20
  video_stream_cooldown_frames: 0
  log_dir: data/logs

source:
  demo_videos:
    - data/videos/test1.MOV
    - data/videos/test2.MOV
  default_offline_video: data/videos/test1.MOV
  default_camera_index: 0
  default_stream_url: ""
  frame_rotation: 0
  camera_width: 1280
  camera_height: 720

detector:
  mode: yolo
  yolo_model_path: models/best_v02.pt
  anomaly_mode: false
  yolo:
    confidence_threshold: 0.35
    image_size: 640
    device: cpu
  anomaly:
    threshold: 0.55
    blur_threshold: 60.0
    darkness_threshold: 55.0
    min_foreground_ratio: 0.010

validation:
  mode: clip_attachment
  anomaly_threshold: 0.55
  clip_attachment:
    min_confidence: 0.35
    # NOK at this box-edge distance (native pixels) or mask intersection.
    # Otherwise OK by default, including missing detections; no cable test.
    connector_near_px: 20.0

visualization:
  draw_zones: false
  draw_boxes: false
  draw_masks: true
  show_labels: true
  person_mask:
    enabled: false
    model_path: yolov8s.pt
    confidence_threshold: 0.25
    image_size: 640
    device: cpu
    every_n_frames: 1
    overlay_alpha: 0.55
    overlay_color_bgr: [70, 190, 90]
    blur_kernel: 31
    min_area_ratio: 0.01
